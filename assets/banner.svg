<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Mustafa — The Silent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.55" stop-color="#0d0f11"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="320" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>

    <rect x="0" y="0" width="3" height="320" fill="url(#mark)"/>

    <text x="72" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" letter-spacing="6.5" fill="#6b7280">T H E   S I L E N T</text>

    <text x="70" y="164" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif"
          font-weight="700" font-size="64" letter-spacing="-1.2" fill="#f4f4f5">Mustafa</text>

    <line x1="72" y1="192" x2="520" y2="192" stroke="#1f2937" stroke-width="1"/>

    <text x="72" y="226" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="18" fill="#b4b4bb">Cybersecurity student</text>
    <text x="262" y="226" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="18" fill="#3f3f46">·</text>
    <text x="280" y="226" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="18" fill="#b4b4bb">Web security scanning</text>

    <text x="72" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" fill="#5b5b66">TypeScript · React · Node · Supabase</text>

    <g stroke="#22c55e" stroke-opacity="0.55" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 852 160 H 958"/>
      <path d="M 958 160 L 976 126 L 994 196 L 1012 74 L 1030 246 L 1048 134 L 1066 188 L 1084 160 H 1208"/>
    </g>
    <circle cx="1210" cy="160" r="3" fill="#22c55e" fill-opacity="0.85"/>
  </g>
